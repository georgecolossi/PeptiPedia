<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PeptiPedia — Suíte de Homologação Científica P3</title>
  <script>
    window.addEventListener('error', (e) => {
      const out = document.getElementById('output');
      if (out) out.textContent += '[JS ERROR IN PAGE]: ' + e.message + ' at ' + e.filename + ':' + e.lineno + '\n';
    });
    window.lucide = {
      createIcons: () => {}
    };
  </script>
  <script src="js/peptides-data.js"></script>
  <script src="js/stacks-data.js"></script>
  <script src="js/studies-data.js"></script>
  <script src="js/glossary-data.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/stability-data.js"></script>
  <script src="js/stability.js"></script>
</head>
<body style="background:#0f172a;color:#f8fafc;font-family:monospace;padding:20px;">
  <h1>PeptiPedia — Suíte de Homologação Científica P3 (V8 Engine)</h1>
  <div id="status">Executando homologação científica P3...</div>
  <pre id="output" style="background:#1e293b;padding:15px;border-radius:8px;border:1px solid #334155;white-space:pre-wrap;"></pre>

  <!-- Container de Toasts -->
  <div id="toast-container"></div>

  <!-- Modal de Detalhes do Peptídeo -->
  <div id="detail-modal" class="hidden">
    <div id="detail-modal-content"></div>
    <div id="modal-footer">
      <button id="close-modal-btn">Fechar</button>
      <button id="modal-fav-btn">Favorito</button>
      <button id="modal-stack-toggle-btn">Stack</button>
      <button id="modal-calc-btn">Calcular Reconstituição</button>
      <button id="modal-view-studies-link">Ver Estudos</button>
    </div>
  </div>

  <!-- Seção da Calculadora -->
  <div id="calculator-section">
    <input id="calc-vial-mg" type="number" />
    <input id="calc-water-ml" type="number" />
    <input id="calc-dose-input" type="number" />
    <button id="calc-unit-mcg-btn">mcg</button>
    <button id="calc-unit-mg-btn">mg</button>
    <span id="calc-dose-unit-label">mcg</span>
    <select id="calc-syringe-type">
      <option value="u100">U-100 (1,0 mL / 100 UI)</option>
      <option value="u50">U-50 (0,5 mL / 50 UI)</option>
      <option value="u30">U-30 (0,3 mL / 30 UI)</option>
    </select>
    <input id="calc-vial-cost" type="number" />
    <input id="calc-frequency" type="number" value="7" />

    <div id="calc-res-units">—</div>
    <div id="calc-res-volume">—</div>
    <div id="calc-res-conc">—</div>
    <div id="calc-res-unit-val">—</div>
    <div id="calc-res-doses">—</div>
    <div id="calc-res-days">—</div>
    <div id="calc-res-cost">—</div>
    <div id="calc-warning-box" class="hidden"></div>
  </div>

  <!-- Script da Aplicação -->
  <script src="js/app.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const out = document.getElementById('output');
      let passed = 0;
      let failed = 0;
      const results = [];

      function log(msg) {
        out.textContent += msg + '\n';
      }

      function assert(condition, testName) {
        if (condition) {
          passed++;
          log(`[PASS] ${testName}`);
          results.push({ test: testName, pass: true });
        } else {
          failed++;
          log(`[FAIL] ${testName}`);
          results.push({ test: testName, pass: false });
        }
      }

      try {
        log("======================================================================");
        log("INICIANDO SUÍTE DE HOMOLOGAÇÃO P3 NO MOTOR V8 DO GOOGLE CHROME");
        log("======================================================================\n");

        // ---------------------------------------------------------------------
        // BLOCO 1: BASELINE E INTEGRIDADE DO CATÁLOGO (72 COMPOSTOS, 65 ESTUDOS)
        // ---------------------------------------------------------------------
        log("--- BLOCO 1: INTEGRIDADE DO CATÁLOGO P3 ---");
        assert(typeof PEPTIDES_DATABASE !== 'undefined' && Array.isArray(PEPTIDES_DATABASE), "1.1 PEPTIDES_DATABASE está definido como Array global");
        assert(PEPTIDES_DATABASE.length === 72, "1.2 Contagem exata de 72 compostos no catálogo (57 legados + 15 novos dossiês)");
        
        const allIds = PEPTIDES_DATABASE.map(p => p.id);
        const uniqueIds = new Set(allIds);
        assert(uniqueIds.size === 72, "1.3 Todos os 72 IDs são estritamente únicos (sem colisões)");

        assert(PEPTIDES_DATABASE[0].id === 'bpc-157', "1.4 Primeiro composto legado é bpc-157");
        assert(PEPTIDES_DATABASE[56].id === 'setmelanotide', "1.5 57º composto legado é setmelanotide");
        
        const expectedP3Ids = [
          "abaloparatide", "ace-031", "ahk-cu", "b7-33", "dulaglutide",
          "eloralintide", "foxo4-dri", "gonadorelin", "hcg", "somatropin",
          "menotropin-hmg", "palmitoyl-pentapeptide-4", "pe-22-28", "ptd-dbm", "triptorelin"
        ];
        const p3Present = expectedP3Ids.every(id => allIds.includes(id));
        assert(p3Present, "1.6 Todos os 15 IDs elegíveis de P3 estão presentes no catálogo");

        // Retenção obrigatória
        assert(!allIds.includes("p21") && !allIds.includes("p021") && !allIds.includes("p021-cntf-analog-review"), "1.7 P21/P021 permanece retido por identidade incerta fora de PEPTIDES_DATABASE");
        assert(!allIds.includes("cbl-514"), "1.8 CBL-514 não está em PEPTIDES_DATABASE (substância não-peptídica excluída do catálogo primário)");

        // ---------------------------------------------------------------------
        // BLOCO 2: CLASSIFICAÇÃO DE BIOLÓGICOS / PROTEÍNAS
        // ---------------------------------------------------------------------
        log("--- BLOCO 2: CLASSIFICAÇÃO DE BIOLÓGICOS / PROTEÍNAS ---");
        const somatropin = PEPTIDES_DATABASE.find(p => p.id === 'somatropin');
        assert(somatropin && somatropin.isBiologicProtein === true && somatropin.entityType === 'biologic_protein', "2.1 Somatropina (HGH) é classificada como biologic_protein / isBiologicProtein: true");
        assert(somatropin && somatropin.protocolEvidenceType === 'approved_label', "2.2 Somatropina possui protocolo classificado como approved_label");

        const hcg = PEPTIDES_DATABASE.find(p => p.id === 'hcg');
        assert(hcg && hcg.isBiologicProtein === true && hcg.entityType === 'biologic_protein', "2.3 HCG é classificado como biologic_protein / isBiologicProtein: true");
        assert(hcg && hcg.protocolEvidenceType === 'approved_label', "2.4 HCG possui protocolo classificado como approved_label");

        const hmg = PEPTIDES_DATABASE.find(p => p.id === 'menotropin-hmg');
        assert(hmg && hmg.isBiologicProtein === true && hmg.entityType === 'biologic_protein', "2.5 HMG (Menotropina) é classificado como biologic_protein / isBiologicProtein: true");
        assert(hmg && hmg.protocolEvidenceType === 'approved_label', "2.6 HMG possui protocolo classificado como approved_label");

        const ace031 = PEPTIDES_DATABASE.find(p => p.id === 'ace-031');
        assert(ace031 && ace031.isBiologicProtein === true && ace031.entityType === 'biologic_protein', "2.7 ACE-031 é classificado como biologic_protein / isBiologicProtein: true");
        assert(ace031 && ace031.protocolEvidenceType === 'clinical_trial_only', "2.8 ACE-031 possui protocolo classificado como clinical_trial_only (ensaio interrompido)");

        const dulaglutide = PEPTIDES_DATABASE.find(p => p.id === 'dulaglutide');
        assert(dulaglutide && dulaglutide.isBiologicProtein === true && dulaglutide.entityType === 'biologic_protein', "2.9 Dulaglutida (Trulicity) é classificada como biologic_protein / isBiologicProtein: true");
        assert(dulaglutide && dulaglutide.protocolEvidenceType === 'approved_label', "2.10 Dulaglutida possui protocolo classificado como approved_label");

        // ---------------------------------------------------------------------
        // BLOCO 3: COMPOSTOS INVESTIGACIONAIS SEM DOSE HUMANA VALIDADA
        // ---------------------------------------------------------------------
        log("--- BLOCO 3: COMPOSTOS INVESTIGACIONAIS SEM DOSE HUMANA ---");
        const noDoseIds = ["ahk-cu", "b7-33", "foxo4-dri", "pe-22-28", "ptd-dbm"];
        noDoseIds.forEach((id, idx) => {
          const comp = PEPTIDES_DATABASE.find(p => p.id === id);
          assert(comp && comp.protocolEvidenceType === 'investigational_no_dose', `3.${idx*3 + 1} ${id} possui protocolEvidenceType === 'investigational_no_dose'`);
          assert(comp && comp.researchProtocols && comp.researchProtocols.typicalDose.includes("Não há dose humana validada"), `3.${idx*3 + 2} ${id} exibe 'Não há dose humana validada nesta base de evidências'`);
          assert(comp && comp.reconstitution && comp.reconstitution.vialSize === "Não aplicável", `3.${idx*3 + 3} ${id} possui reconstituição como 'Não aplicável' sem fabricação de diluente`);
        });

        // ---------------------------------------------------------------------
        // BLOCO 4: COMPOSTOS COM BULA APROVADA E ENSAIO CLÍNICO
        // ---------------------------------------------------------------------
        log("--- BLOCO 4: BULA APROVADA E BRAÇO DE ENSAIO ---");
        const abalo = PEPTIDES_DATABASE.find(p => p.id === 'abaloparatide');
        assert(abalo && abalo.protocolEvidenceType === 'approved_label', "4.1 Abaloparatida possui protocolEvidenceType === 'approved_label'");
        assert(abalo && abalo.researchProtocols.typicalDose.includes("80 mcg"), "4.2 Abaloparatida possui dose usual de 80 mcg de bula FDA (TYMLOS)");

        const elora = PEPTIDES_DATABASE.find(p => p.id === 'eloralintide');
        assert(elora && elora.protocolEvidenceType === 'clinical_trial_only', "4.3 Eloralintida possui protocolEvidenceType === 'clinical_trial_only'");
        assert(elora && elora.protocolEvidenceNote.includes("NCT06230523"), "4.4 Eloralintida cita o ensaio clínico de fase 2 NCT06230523");

        const tripto = PEPTIDES_DATABASE.find(p => p.id === 'triptorelin');
        assert(tripto && tripto.protocolEvidenceType === 'approved_label', "4.5 Triptorelina possui protocolEvidenceType === 'approved_label'");
        assert(tripto && tripto.criticalAlert.includes("FLARE HORMONAL"), "4.6 Triptorelina inclui aviso crítico obrigatório sobre flare hormonal");

        const matrixyl = PEPTIDES_DATABASE.find(p => p.id === 'palmitoyl-pentapeptide-4');
        assert(matrixyl && matrixyl.protocolEvidenceType === 'clinical_trial_only', "4.7 Palmitoyl Pentapeptide-4 possui protocolEvidenceType === 'clinical_trial_only'");
        assert(matrixyl && matrixyl.primaryRoute.includes("Tópica"), "4.8 Palmitoyl Pentapeptide-4 possui via principal Tópica");

        // ---------------------------------------------------------------------
        // BLOCO 5: ENSAIOS CLÍNICOS HUMANOS (CLINICAL_STUDIES_DATABASE = 65)
        // ---------------------------------------------------------------------
        log("--- BLOCO 5: ENSAIOS CLÍNICOS HUMANOS (CLINICAL_STUDIES_DATABASE) ---");
        assert(typeof CLINICAL_STUDIES_DATABASE !== 'undefined' && Array.isArray(CLINICAL_STUDIES_DATABASE), "5.1 CLINICAL_STUDIES_DATABASE está definido globalmente");
        assert(CLINICAL_STUDIES_DATABASE.length === 65, "5.2 Contagem exata de 65 estudos clínicos (57 legados + 8 novos ensaios humanos)");

        const p3StudyIds = [
          "study-abaloparatide-active",
          "study-ace031-dmd",
          "study-dulaglutide-rewind",
          "study-eloralintide-phase2",
          "study-gonadorelin-pulsatile",
          "study-hcg-hypogonadism",
          "study-hmg-spermatogenesis",
          "study-palmitoyl-pentapeptide4-cosmetic"
        ];
        p3StudyIds.forEach((sid, idx) => {
          const st = CLINICAL_STUDIES_DATABASE.find(s => s.id === sid);
          assert(st !== undefined, `5.${idx*2 + 3} Estudo ${sid} está indexado em CLINICAL_STUDIES_DATABASE`);
          assert(st && st.pmid && st.pmid.length >= 7, `5.${idx*2 + 4} Estudo ${sid} possui PMID válido (${st ? st.pmid : 'N/A'})`);
        });

        // ---------------------------------------------------------------------
        // BLOCO 6: TRAVAS DE SEGURANÇA E CALCULADORA FAIL-CLOSED
        // ---------------------------------------------------------------------
        log("--- BLOCO 6: TRAVAS DA CALCULADORA E COMPORTAMENTO DE INTERFACE ---");
        const ahkCu = PEPTIDES_DATABASE.find(p => p.id === 'ahk-cu');
        assert(typeof prefillCalculatorWithPeptide === 'function', "6.1 Função prefillCalculatorWithPeptide exposta no escopo");
        const prefillAhk = prefillCalculatorWithPeptide(ahkCu);
        assert(prefillAhk === false, "6.2 prefillCalculatorWithPeptide recusa carregar AHK-Cu (investigacional sem dose humana)");

        const prefillFoxo = prefillCalculatorWithPeptide(PEPTIDES_DATABASE.find(p => p.id === 'foxo4-dri'));
        assert(prefillFoxo === false, "6.3 prefillCalculatorWithPeptide recusa carregar FOXO4-DRI");

        assert(typeof getEvidenceBadgeHtml === 'function', "6.4 getEvidenceBadgeHtml está definida");
        const bApp = getEvidenceBadgeHtml('approved_label');
        assert(bApp.includes("Bula Aprovada"), "6.5 getEvidenceBadgeHtml('approved_label') renderiza badge de Bula Aprovada");
        const bTrial = getEvidenceBadgeHtml('clinical_trial_only');
        assert(bTrial.includes("Braço de Ensaio"), "6.6 getEvidenceBadgeHtml('clinical_trial_only') renderiza badge de Braço de Ensaio");
        const bNoDose = getEvidenceBadgeHtml('investigational_no_dose');
        assert(bNoDose.includes("Sem Dose Humana"), "6.7 getEvidenceBadgeHtml('investigational_no_dose') renderiza badge de Sem Dose Humana");

        // ---------------------------------------------------------------------
        // BLOCO 7: PRESERVAÇÃO DE STACKS, GLOSSÁRIO E ESTABILIDADE
        // ---------------------------------------------------------------------
        log("--- BLOCO 7: STACKS, GLOSSÁRIO E APRESENTAÇÕES MULTIFORMULAÇÃO ---");
        assert(typeof RESEARCH_STACKS !== 'undefined' && RESEARCH_STACKS.length === 18, "7.1 RESEARCH_STACKS preserva exatamente os 18 stacks originais");
        assert(typeof GLOSSARY_DATABASE !== 'undefined' && GLOSSARY_DATABASE.length === 37, "7.2 GLOSSARY_DATABASE preserva exatamente os 37 verbetes originais");
        
        // Multiformulações
        const multiformPeptides = PEPTIDES_DATABASE.filter(p => p.formulations && p.formulations.length > 0);
        assert(multiformPeptides.length === 5, "7.3 Exatamente os 5 compostos multiformulação originais permanecem configurados");
        const totalFormulations = multiformPeptides.reduce((acc, p) => acc + p.formulations.length, 0);
        assert(totalFormulations === 12, "7.4 Exatamente as 12 apresentações farmacêuticas multiformulação estão preservadas");

        // Setmelanotida estabilidade P2G25
        const setm = PEPTIDES_DATABASE.find(p => p.id === 'setmelanotide');
        assert(setm && setm.formulations && setm.formulations[0].inUseStability.includes("30 dias"), "7.5 Setmelanotida preserva tolerância térmica de até 30 dias a 2°C–25°C da bula FDA 2026");

        // ---------------------------------------------------------------------
        // RESUMO FINAL
        // ---------------------------------------------------------------------
        log("\n======================================================================");
        log(`HOMOLOGAÇÃO P3 CONCLUÍDA: ${passed} asserções aprovadas, ${failed} falhas.`);
        log("======================================================================");

        const statusEl = document.getElementById('status');
        if (failed === 0) {
          statusEl.textContent = `APROVADO: ${passed}/${passed} asserções científicas homologadas com sucesso.`;
          statusEl.style.color = '#34d399';
        } else {
          statusEl.textContent = `REPROVADO: ${failed} asserções falharam.`;
          statusEl.style.color = '#f87171';
        }

        window.__TEST_RESULTS__ = {
          total: passed + failed,
          passed: passed,
          failed: failed,
          results: results
        };

      } catch (err) {
        log(`[FATAL ERROR]: ${err.message}\n${err.stack}`);
        failed++;
        const statusEl = document.getElementById('status');
        statusEl.textContent = `ERRO FATAL: ${err.message}`;
        statusEl.style.color = '#f87171';
        window.__TEST_RESULTS__ = {
          total: passed + failed,
          passed: passed,
          failed: failed,
          error: err.message,
          results: results
        };
      }
    });
  </script>
</body>
</html>
